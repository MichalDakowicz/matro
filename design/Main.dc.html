<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matro player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
a{color:#F3F1EC}a:hover{color:#FFFFFF}
.ib{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:#F3F1EC;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:hover{background:rgba(255,255,255,0.09)}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:0;color:#F3F1EC;text-align:left;cursor:pointer;font:inherit;padding:10px 14px;border-radius:16px;min-height:48px}
.opt:hover{background:rgba(255,255,255,0.06)}
.qplay{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit;padding:0}
.qrow:hover{background:rgba(255,255,255,0.04)}
.seg{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;min-width:44px;height:36px;border-radius:999px}
.txtbtn{border:0;background:transparent;color:#A9A59D;font:inherit;font-size:13px;cursor:pointer;padding:8px 14px;border-radius:999px;min-height:36px}
.txtbtn:hover{color:#F3F1EC;background:rgba(255,255,255,0.06)}
.range{position:absolute;inset:-10px 0;width:100%;height:calc(100% + 20px);opacity:0;cursor:pointer;margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #0A0A0B; color: #F3F1EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; border-radius: 28px">

  <!-- Player -->
  <div style="position: relative; flex: 1; min-width: 0; margin: 12px; border-radius: 24px; background: #000; overflow: hidden">

    <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #55524C; font-size: 14px">[video frame]</div>

    <!-- top scrim + title -->
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0))"></div>
    <div style="position: absolute; left: 32px; right: 32px; top: 28px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <p style="margin: 0; font-size: 14px; font-weight: 500; color: #BDB8AF">{{current.series}}</p>
        <h1 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em">{{current.title}}</h1>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; flex: none">
        <span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.1); color: #E7E3DB">MKV</span>
        <span style="font-size: 12px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.1); color: #E7E3DB">1080p · HEVC 10-bit</span>
        <span style="font-size: 12px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.1); color: #E7E3DB">{{audioLabel}}</span>
      </div>
    </div>

    <!-- bottom scrim -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.85))"></div>

    <!-- subtitle -->
    <sc-if value="{{hasLine}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 0; right: 0; bottom: 172px; display: flex; justify-content: center; padding: 0 80px">
        <p style="margin: 0; text-align: center; white-space: pre-line; font-weight: 500; line-height: 1.3; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 2px #000; font-size: {{subSize}}px">{{line}}</p>
      </div>
    </sc-if>

    <!-- controls -->
    <div style="position: absolute; left: 32px; right: 32px; bottom: 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="font-size: 13px; font-variant-numeric: tabular-nums; color: #E7E3DB; width: 56px">{{posLabel}}</span>
        <div style="position: relative; flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.22)">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: rgba(255,255,255,0.35); width: {{bufPct}}%"></div>
          <div style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: {{accent}}; width: {{pct}}%"></div>
          <sc-for list="{{chapters}}" as="c" hint-placeholder-count="4">
            <div style="position: absolute; top: 0; bottom: 0; width: 3px; background: #000; left: {{c.left}}%"></div>
          </sc-for>
          <div style="position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 999px; background: #FFFFFF; left: {{pct}}%"></div>
          <input class="range" type="range" min="0" max="{{dur}}" value="{{pos}}" onChange="{{onSeek}}" aria-label="Seek">
        </div>
        <span style="font-size: 13px; font-variant-numeric: tabular-nums; color: #A9A59D; width: 56px; text-align: right">{{durLabel}}</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 6px">
          <button class="ib" aria-label="Previous in queue" onClick="{{prev}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M18 6l-9 6 9 6z"></path></svg></button>
          <button class="ib" aria-label="Back 10 seconds" onClick="{{back10}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4h4"></path></svg></button>
          <button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 56px; height: 56px; border-radius: 999px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 6px; color: #0A0A0B; background: {{accent}}">
            <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
            <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></sc-if>
          </button>
          <button class="ib" aria-label="Forward 10 seconds" onClick="{{fwd10}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v4h-4"></path></svg></button>
          <button class="ib" aria-label="Next in queue" onClick="{{next}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M6 6l9 6-9 6z"></path></svg></button>
          <div style="display: flex; align-items: center; gap: 8px; margin-left: 14px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>
            <div style="position: relative; width: 96px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.22)">
              <div style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: #F3F1EC; width: {{vol}}%"></div>
              <input class="range" type="range" min="0" max="100" value="{{vol}}" onChange="{{onVol}}" aria-label="Volume">
            </div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 6px">
          <button class="ib" aria-label="Audio and subtitles" aria-expanded="{{tracksOpen}}" onClick="{{toggleTracks}}" style="background: {{tracksBtnBg}}; color: {{tracksBtnFg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 14h4M13 14h4M7 10h3M12 10h5"></path></svg></button>
          <button class="ib" aria-label="Queue" aria-expanded="{{queueOpen}}" onClick="{{toggleQueue}}" style="background: {{queueBtnBg}}; color: {{queueBtnFg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8"></path><path d="M17 15v6l4.5-3z"></path></svg></button>
          <button class="ib" aria-label="Fullscreen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
        </div>
      </div>
    </div>

    <!-- tracks popover -->
    <sc-if value="{{tracksOpen}}" hint-placeholder-val="{{ true }}">
      <div role="dialog" aria-label="Audio and subtitles" style="position: absolute; right: 32px; bottom: 120px; width: 600px; background: rgba(24,24,27,0.94); border: 0; border-radius: 28px; padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 16px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <p style="margin: 0 0 6px 14px; font-size: 15px; font-weight: 700">Audio</p>
            <sc-for list="{{audios}}" as="a" hint-placeholder-count="4">
              <button class="opt" onClick="{{a.pick}}" aria-pressed="{{a.sel}}" style="background: {{a.bg}}">
                <span style="flex: none; width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 1.5px solid {{a.ring}}; background: {{a.fill}}">
                  <sc-if value="{{a.sel}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                  <span style="font-size: 14px; font-weight: 600">{{a.name}}</span>
                  <span style="font-size: 12px; color: #A9A59D">{{a.meta}}</span>
                </span>
              </button>
            </sc-for>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <p style="margin: 0 0 6px 14px; font-size: 15px; font-weight: 700">Subtitles</p>
            <sc-for list="{{subs}}" as="s" hint-placeholder-count="5">
              <button class="opt" onClick="{{s.pick}}" aria-pressed="{{s.sel}}" style="background: {{s.bg}}">
                <span style="flex: none; width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 1.5px solid {{s.ring}}; background: {{s.fill}}">
                  <sc-if value="{{s.sel}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                  <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
                  <span style="font-size: 12px; color: #A9A59D">{{s.meta}}</span>
                </span>
              </button>
            </sc-for>
          </div>
        </div>

        

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 13px; color: #A9A59D">Sub delay</span>
            <button class="ib" aria-label="Subtitles earlier by 0.1 seconds" onClick="{{delayDown}}" style="width: 36px; height: 36px; background: rgba(255,255,255,0.06)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
            <span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; width: 52px; text-align: center">{{delayLabel}}</span>
            <button class="ib" aria-label="Subtitles later by 0.1 seconds" onClick="{{delayUp}}" style="width: 36px; height: 36px; background: rgba(255,255,255,0.06)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg></button>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 13px; color: #A9A59D">Size</span>
            <div style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.06)">
              <sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
                <button class="seg" onClick="{{z.pick}}" aria-pressed="{{z.sel}}" style="background: {{z.bg}}; color: {{z.fg}}">{{z.label}}</button>
              </sc-for>
            </div>
          </div>
          <button class="txtbtn">Load subtitle file…</button>
        </div>
      </div>
    </sc-if>
  </div>

  <!-- Queue -->
  <sc-if value="{{queueOpen}}" hint-placeholder-val="{{ true }}">
    <aside aria-label="Queue" style="width: 372px; flex: none; margin: 12px 12px 12px 0; border-radius: 24px; background: #161618; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 28px 24px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em">Queue</h2>
          <span style="font-size: 13px; color: #A9A59D">{{queueMeta}}</span>
        </div>
        <button class="txtbtn" onClick="{{clearWatched}}">Clear watched</button>
      </div>

      <div style="flex: 1; overflow-y: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{queue}}" as="q" hint-placeholder-count="6">
          <div class="qrow" style="display: flex; align-items: center; gap: 6px; padding: 10px 6px 10px 10px; border-radius: 20px; background: {{q.bg}}">
            <button class="qplay" onClick="{{q.play}}" aria-label="Play {{q.title}}">
              <span style="position: relative; flex: none; width: 104px; height: 58px; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: {{q.tone}}">
                <span style="font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.75)">{{q.code}}</span>
                <span style="position: absolute; left: 0; bottom: 0; height: 3px; background: {{q.barColor}}; width: {{q.progress}}%"></span>
              </span>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                <span style="font-size: 12px; font-weight: 600; color: {{q.kickerColor}}">{{q.kicker}}</span>
                <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{q.titleColor}}">{{q.title}}</span>
                <span style="font-size: 12px; color: #A9A59D">{{q.length}}</span>
              </span>
            </button>
            <button class="ib" aria-label="Remove {{q.title}} from queue" onClick="{{q.remove}}" style="color: #A9A59D; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
        </sc-for>
      </div>

      <div style="margin: 8px 12px 12px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">Autoplay next</span>
          <span style="font-size: 12px; color: #A9A59D">Keeps your audio &amp; subtitle picks</span>
        </div>
        <button onClick="{{toggleAuto}}" aria-pressed="{{autoplay}}" aria-label="Autoplay next" style="width: 48px; height: 28px; border-radius: 999px; border: 0; cursor: pointer; position: relative; padding: 0; background: {{autoBg}}">
          <span style="position: absolute; top: 3px; width: 22px; height: 22px; border-radius: 999px; background: {{autoKnobBg}}; left: {{autoKnob}}px"></span>
        </button>
      </div>
    </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      playing: true, pos: 1452, vol: 72,
      tracksOpen: true, queueOpen: true,
      audio: 'en', sub: 'en', delay: 0, size: 'M',
      current: 'e3', autoplay: true,
      queue: ['e2', 'e3', 'e4', 'e5', 'm1', 'm2']
    };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.playing) return;
      const item = this.items()[this.state.current];
      this.setState((s) => ({ pos: Math.min(s.pos + 1, item ? item.dur : s.pos) }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  items() {
    return {
      e2: { series: 'Northbound · Season 1 · Episode 2', kicker: 'S1 · E2', code: 'E2', title: 'Whiteout', dur: 2885, tone: '#2B3138' },
      e3: { series: 'Northbound · Season 1 · Episode 3', kicker: 'S1 · E3', code: 'E3', title: 'The Long Thaw', dur: 3100, tone: '#33302B' },
      e4: { series: 'Northbound · Season 1 · Episode 4', kicker: 'S1 · E4', code: 'E4', title: 'Signal Fire', dur: 2962, tone: '#3A2A26' },
      e5: { series: 'Northbound · Season 1 · Episode 5', kicker: 'S1 · E5', code: 'E5', title: 'Ice Road', dur: 3190, tone: '#26303A' },
      m1: { series: 'Movie · 2024', kicker: 'Movie · 2024', code: 'QH', title: 'The Quiet Harbour', dur: 6720, tone: '#2A3530' },
      m2: { series: 'Movie · 2019', kicker: 'Movie · 2019', code: 'PL', title: 'Paper Lanterns', dur: 5880, tone: '#372B33' }
    };
  }
  fmt(t) {
    t = Math.max(0, Math.round(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const mm = h ? String(m).padStart(2, '0') : String(m);
    return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
  }
  hm(t) {
    const h = Math.floor(t / 3600), m = Math.round((t % 3600) / 60);
    return h ? h + ' h ' + m + ' m' : m + ' min';
  }
  go(id) { this.setState({ current: id, pos: 0, playing: true }); }
  render0() {}
  renderVals() {
    const accent = '#F3F1EC';
    const S = this.state;
    const ITEMS = this.items();
    const cur = ITEMS[S.current] || ITEMS.e3;
    const qi = S.queue.indexOf(S.current);

    const AUDIO = [
      { id: 'en', name: 'English', meta: 'E-AC3 5.1 · default', chip: 'E-AC3 5.1 · EN' },
      { id: 'pl', name: 'Polski — lektor', meta: 'AAC 2.0', chip: 'AAC 2.0 · PL' },
      { id: 'ja', name: '日本語', meta: 'AAC 2.0 · dub', chip: 'AAC 2.0 · JA' },
      { id: 'com', name: 'Director’s commentary', meta: 'English · AAC 2.0', chip: 'AAC 2.0 · Commentary' }
    ];
    const SUBS = [
      { id: 'off', name: 'Off', meta: 'No subtitles' },
      { id: 'en', name: 'English', meta: 'SRT · embedded' },
      { id: 'sdh', name: 'English SDH', meta: 'PGS · embedded' },
      { id: 'pl', name: 'Polski', meta: 'ASS · embedded' },
      { id: 'plf', name: 'Polski — forced', meta: 'ASS · signs & songs only' }
    ];
    const LINES = {
      off: '', plf: '',
      en: 'We should have left before the snow came.',
      sdh: '[wind howling]\nWe should have left before the snow came.',
      pl: 'Powinniśmy byli wyjechać, zanim spadł śnieg.'
    };
    const SIZES = { S: 26, M: 32, L: 40 };

    const pickRow = (sel) => ({
      bg: sel ? 'rgba(255,255,255,0.07)' : 'transparent',
      ring: sel ? accent : 'rgba(255,255,255,0.35)',
      fill: sel ? accent : 'transparent'
    });

    const audios = AUDIO.map((a) => Object.assign({}, a, pickRow(S.audio === a.id), {
      sel: S.audio === a.id, pick: () => this.setState({ audio: a.id })
    }));
    const subs = SUBS.map((s) => Object.assign({}, s, pickRow(S.sub === s.id), {
      sel: S.sub === s.id, pick: () => this.setState({ sub: s.id })
    }));
    const sizes = ['S', 'M', 'L'].map((z) => ({
      label: z, sel: S.size === z,
      bg: S.size === z ? '#F3F1EC' : 'transparent',
      fg: S.size === z ? '#0A0A0B' : '#E7E3DB',
      pick: () => this.setState({ size: z })
    }));

    let remaining = 0;
    const queue = S.queue.map((id, i) => {
      const it = ITEMS[id];
      const active = id === S.current;
      const done = qi >= 0 && i < qi;
      if (active) remaining += it.dur - S.pos; else if (!done) remaining += it.dur;
      return {
        title: it.title, code: it.code, tone: it.tone,
        kicker: active ? (S.playing ? 'Now playing' : 'Paused') : (done ? 'Watched' : it.kicker),
        kickerColor: active ? accent : '#A9A59D',
        titleColor: done ? '#8E8A83' : '#F3F1EC',
        length: active ? this.fmt(it.dur - S.pos) + ' left' : this.hm(it.dur),
        bg: active ? 'rgba(255,255,255,0.07)' : 'transparent',
        progress: done ? 100 : (active ? (S.pos / it.dur) * 100 : 0),
        barColor: done ? 'rgba(255,255,255,0.45)' : accent,
        play: () => this.go(id),
        remove: () => this.setState((s) => {
          const nq = s.queue.filter((x) => x !== id);
          if (id !== s.current) return { queue: nq };
          const nxt = nq[Math.min(s.queue.indexOf(id), nq.length - 1)];
          return { queue: nq, current: nxt || s.current, pos: 0 };
        })
      };
    });

    const step = (d) => () => {
      const i = S.queue.indexOf(S.current) + d;
      if (i >= 0 && i < S.queue.length) this.go(S.queue[i]);
    };

    const audioSel = AUDIO.find((a) => a.id === S.audio);
    const line = LINES[S.sub] || '';
    const d = S.delay;

    return {
      accent,
      current: cur,
      playing: S.playing, paused: !S.playing,
      playLabel: S.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState((s) => ({ playing: !s.playing })),
      pos: S.pos, dur: cur.dur,
      pct: (S.pos / cur.dur) * 100,
      bufPct: Math.min(100, ((S.pos + 240) / cur.dur) * 100),
      posLabel: this.fmt(S.pos), durLabel: this.fmt(cur.dur),
      chapters: [0.18, 0.41, 0.66, 0.88].map((f) => ({ left: f * 100 })),
      onSeek: (e) => this.setState({ pos: Number(e.target.value) }),
      vol: S.vol,
      onVol: (e) => this.setState({ vol: Number(e.target.value) }),
      back10: () => this.setState((s) => ({ pos: Math.max(0, s.pos - 10) })),
      fwd10: () => this.setState((s) => ({ pos: Math.min(cur.dur, s.pos + 10) })),
      prev: step(-1), next: step(1),
      tracksOpen: S.tracksOpen,
      toggleTracks: () => this.setState((s) => ({ tracksOpen: !s.tracksOpen })),
      tracksBtnBg: S.tracksOpen ? '#F3F1EC' : 'transparent',
      tracksBtnFg: S.tracksOpen ? '#0A0A0B' : '#F3F1EC',
      queueOpen: S.queueOpen,
      toggleQueue: () => this.setState((s) => ({ queueOpen: !s.queueOpen })),
      queueBtnBg: S.queueOpen ? '#F3F1EC' : 'transparent',
      queueBtnFg: S.queueOpen ? '#0A0A0B' : '#F3F1EC',
      audios, subs, sizes,
      audioLabel: audioSel ? audioSel.chip : '',
      hasLine: !!line, line, subSize: SIZES[S.size],
      delayLabel: (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(1) + ' s',
      delayDown: () => this.setState((s) => ({ delay: Math.round((s.delay - 0.1) * 10) / 10 })),
      delayUp: () => this.setState((s) => ({ delay: Math.round((s.delay + 0.1) * 10) / 10 })),
      queue,
      queueMeta: S.queue.length + ' items · ' + this.hm(remaining) + ' left',
      clearWatched: () => this.setState((s) => {
        const i = s.queue.indexOf(s.current);
        return { queue: i > 0 ? s.queue.slice(i) : s.queue };
      }),
      autoplay: S.autoplay,
      toggleAuto: () => this.setState((s) => ({ autoplay: !s.autoplay })),
      autoBg: S.autoplay ? accent : 'rgba(255,255,255,0.18)',
      autoKnob: S.autoplay ? 23 : 3,
      autoKnobBg: S.autoplay ? '#0A0A0B' : '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
