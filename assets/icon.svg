<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128">
  <defs>
    <!-- The app's film grain: desaturated fractal noise over the near-black ground. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="tile"><rect width="128" height="128" rx="34"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="34" fill="#0A0A0B"/>
  <rect width="128" height="128" clip-path="url(#tile)" filter="url(#grain)" opacity="0.13"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="33.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <svg x="22" y="22" width="84" height="84" viewBox="0 0 64 64">
    <path d="M23 13L44 25.5L23 38Z" fill="#F3F1EC" stroke="#F3F1EC" stroke-width="5" stroke-linejoin="round"/>
    <rect x="12" y="46" width="40" height="6" rx="3" fill="#F3F1EC" opacity="0.3"/>
    <rect x="12" y="46" width="22" height="6" rx="3" fill="#F3F1EC"/>
    <circle cx="34" cy="49" r="5" fill="#F3F1EC"/>
  </svg>
</svg>
